# Foundation bundle v0.20.0 manifest
# Minor-additive release over v0.19.0 (Cut 1.6 — closes F-VAL19-5: the read-client gap that made
# the Cut 1.5 remediation path structurally impossible, and bounds the coarse gate's blast radius).
# Emitted-content changes since v0.19.0 are confined to the emitted external_write lib and one
# operator-fill skill template, plus TWO NEW emitted files:
# agents/lib/external_write/capability_runner.py (the kernel-as-runner: the sealed kernel now RUNS
# a capability and INJECTS a READ-ONLY facade it builds itself, so capability code never bootstraps
# a client and never has a reason to import the adapter — a writer that complied previously could
# not read, and a writer that read could not comply) and
# agents/lib/external_write/writer_acknowledgement.py (the ONE sanctioned exit from a writer state
# no tooling of ours can repair: an explicit, HASH-BOUND, visible, audited operator decision that
# voids the moment the file changes).
# The blocking set is now a SUBSET of the open set: ADR-0046's coarse, attribution-free
# presence-of-violation gate is UNCHANGED and is not undone — what changed is which entries are
# admitted to it, so one unrepairable writer no longer bricks acceptance project-wide forever. A
# non-live test module or an acknowledged unrepairable writer stays VISIBLE (health still withholds
# the all-clear and names it) but no longer blocks. NEEDS_PERSON deliberately REMAINS blocking; its
# only exit is the recorded human decision above.
# Foundation docs are BYTE-IDENTICAL to v0.19.0 (managed_files hashes unchanged;
# foundation_schema_version unchanged).
_note: JSON sidecar for manifest.yaml. The wizard runtime CLI consumes JSON; YAML is the human-facing
  companion. Both files MUST stay in sync.
