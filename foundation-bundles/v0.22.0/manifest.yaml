# Foundation bundle v0.22.0 manifest
# Minor-additive release over v0.21.0.
# This bundle carries the emitted-lib half of one change: a capability's safe, read-only
# access to the outside system is now found by what a module DECLARES it provides --
# `register_read_facade(op_kind, ...)` / `register_adapter(op_kind, ...)`, joined on
# op_kind -- instead of by deriving a filename from the capability id. A project whose
# files were named before that convention existed resolved to nothing, and the miss was
# silent. Filenames are no longer an input to the lookup at all.
# NEW FILE: agents/lib/external_write/topology.py -- an AST-only reader of those
# declarations. It never imports the modules it reads, so resolution can never execute
# operator code as a side effect, and a registration it cannot resolve is surfaced as
# unresolved, naming the file and the line, rather than silently dropped: a silent drop is
# the exact mechanism that hid the defect this closes.
# agents/lib/external_write/capability_runner.py now resolves the read facade through that
# topology and translates a resolution failure into plain, operator-actionable language
# (more than one file claiming the same op_kind; a file whose declaration cannot be read;
# a file that fails to load), classifying purely from the topology error's own attributes
# so the wording can never drift from what the resolver actually decided. The object it
# returns still comes only from the registry accessor that validates it, never out of the
# declaring module's namespace.
# agents/lib/external_write/zones.py adds the kernel-side topology test module to the
# sealed-kernel membership list, for the same reason capability_runner.py already carries
# it: kernel-internal test code, never emitted capability code.
# The other half of this change -- the same declaration reader on the toolkit side, and the
# upgrade notices that name the exact file involved -- ships with the toolkit
# (`wizard self-update`), not this bundle.
# system-artifacts.json goes from 143 to 144 artifacts (the one added file).
# Foundation docs are BYTE-IDENTICAL to v0.21.0 (managed_files hashes unchanged;
# foundation_schema_version unchanged).
_note: JSON sidecar for manifest.yaml. The wizard runtime CLI consumes JSON; YAML is the human-facing
  companion. Both files MUST stay in sync.
