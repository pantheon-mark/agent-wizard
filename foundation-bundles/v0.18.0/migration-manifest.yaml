_note: JSON sidecar for migration-manifest.yaml. The wizard runtime CLI consumes JSON; YAML is the human-facing companion. Both files MUST stay in sync.
artifact_notes:
  agents/lib/external_write/capability_health.py: The health check now tells you plainly (report only, it does not act) when the same capability has been recorded twice, so you can clean it up.
  agents/lib/external_write/dependency_enrollment.py: New helper that resolves, pins, records, and installs a third-party software package the moment a capability's code needs it -- you never run an install command or hand-edit the requirements file.
  agents/lib/external_write/operator_acceptance.py: When turning a capability on cannot be resolved automatically, it now always prints an exact, ready-to-paste next step instead of asking you to fix or extend the command yourself.
  agents/lib/external_write/scan.py: 'Adds a deny-by-default safety check: a capability whose set-aside (paused) code has changed since it was set aside is not scanned or reused until it has been reconciled.'
  agents/lib/external_write/zones.py: Marks the new dependency-enrollment helper as a sealed internal module so a capability cannot import it directly.
  requirements.txt: The requirements file's guidance now explains that packages are enrolled and installed automatically when a capability needs one, never by hand-editing this file.
  wizard/skills/add-capability.md: Notes that any third-party package a new capability's code needs is enrolled and installed automatically during its build, not set up by hand here.
  wizard/skills/next-phase.md: Adds the automatic third-party dependency enrollment step, and the turn-on step now prints an exact ready-to-paste next command when the phase cannot be resolved on its own.
  wizard/skills/rebuild-paused-capability.md: The turn-on step now prints an exact ready-to-paste next command when the phase cannot be resolved on its own, instead of asking you to fix the command.
migrations:
- breaking_changes_summary: ''
  class: minor_additive
  from: v0.17.0
  migration_steps: 1. Run the update check (it reports what's new + the recommendation). 2. On the operator's yes, the assistant applies it ("${{WIZARD_HOME:-$HOME/agent-wizard}}/scripts/wizard" self-upgrade --to v0.18.0 --apply). 3. A backup is taken first; the operator's own data, rules, credentials, and logs are never touched.
  notes: 'Minor-additive release to v0.18.0 (Cut 1.4). Reliability improvements for building and turning on capabilities: (1) turning a capability on now always gives you an exact, ready-to-paste next step when it cannot resolve the details on its own -- it never asks you to fix or extend a command yourself; (2) when a capability''s code needs a third-party software package, the system now resolves, pins, records, and installs it for you automatically, so you never run an install command or hand-edit a requirements file; (3) a capability whose set-aside (paused) code has changed is no longer silently reused until it has been reconciled; and (4) if the same capability is accidentally recorded twice, the health check now tells you plainly (without acting on it) so you can clean it up. No breaking changes; all existing capabilities and files are unaffected.'
  preflight: Verify the operator project carries a .wizard/manifest.json whose foundation_bundle_version is v0.17.0 (or any version in the supported range). A backup is taken automatically.
  requires_operator_approval: true
  rollback: Restore from .wizard/backups/pre-v0.18.0/ and set foundation_bundle_version back to v0.17.0.
  stop_condition: not_applicable
  supported: true
