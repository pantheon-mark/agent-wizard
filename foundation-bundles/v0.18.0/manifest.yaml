# Foundation bundle v0.18.0 manifest
# Minor-additive release over v0.17.0 (Cut 1.4 — reconcile-keying / stub-shadow / acceptance
# / dependency-enrollment reliability findings F-3A/F-3B/F-1/F-2/F-9). Emitted-content changes
# since v0.17.0 are confined to the emitted external_write lib and the operator-fill skill
# templates, plus ONE NEW emitted file: agents/lib/external_write/dependency_enrollment.py
# (resolves, pins, records, and installs a third-party package the moment a capability's code
# needs it — no hand-run pip, no hand-edited requirements file). scan.py adds a deny-by-default
# hash-bound quarantine (a set-aside capability whose code changed is not silently reused until
# reconciled); zones.py marks dependency_enrollment.py as a sealed-kernel module; operator_
# acceptance.py + capability_health.py make turning a capability on always print an exact
# ready-to-paste next step (and surface, report-only, a same-capability-recorded-twice
# integrity conflict); requirements_template + the next-phase / rebuild-paused-capability /
# add-capability skills carry the enrollment and paste-safe acceptance guidance. No other
# emitted content changes: all foundation docs, other templates/, baselines/, and schemas/ are
# byte-for-byte unaffected and previously released bundles still replay. Foundation docs
# byte-identical to v0.17.0 (schema unchanged, v0.3). JSON sidecar (manifest.json) is what the
# engine consumes.
_note: JSON sidecar for manifest.yaml. The wizard runtime CLI consumes JSON; YAML is the human-facing
  companion. Both files MUST stay in sync.
agent_contract_version: v0-pre-rebuild
bundle_manifest_schema_version: v2
foundation_bundle_version: v0.18.0
foundation_schema_version: v0.3
included_templates:
  foundation_docs:
  - vision.md
  - approach.md
  - technical_architecture.md
  - execution_plan.md
  - test_cases.md
  - audit_framework.md
managed_files:
