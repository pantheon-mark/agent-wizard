# Foundation bundle v0.19.0 manifest
# Minor-additive release over v0.18.0 (Cut 1.5 — V15-3 acceptance-linkage false-green fix).
# Emitted-content changes since v0.18.0 are confined to the emitted external_write lib and one
# operator-fill skill template, plus ONE NEW emitted file:
# agents/lib/external_write/_ext_write_state.py (the single canonical open-bespoke-writer-bypass
# predicate PLUS a stateless auto-reap of a resolved writer's pending-migration entry). The fix:
# turning a capability on (operator_acceptance.py) now REFUSES to live-enable while any bespoke
# writer bypasses the sanctioned, safety-gated write surface — closing a false green where a
# capability could go green around an unmigrated hand-rolled writer; the overall health/completion
# status (capability_health.py, lifecycle_state.py) goes non-normal / non-done PROJECT-WIDE,
# attribution-free and fail-closed, whenever such a bypass is open, and names the exact file(s)
# to fix; lifecycle_state.py self-heals on read by reaping a demonstrably-resolved writer entry;
# zones.py marks _ext_write_state.py as a sealed-kernel module; the rebuild-paused-capability
# skill carries the matching repair guidance. No other emitted content changes: all foundation
# docs, other templates/, baselines/, and schemas/ are byte-for-byte unaffected and previously
# released bundles still replay. Foundation docs byte-identical to v0.18.0 (schema unchanged,
# v0.3). Enforcement ceiling unchanged. JSON sidecar (manifest.json) is what the engine consumes.
_note: JSON sidecar for manifest.yaml. The wizard runtime CLI consumes JSON; YAML is the human-facing
  companion. Both files MUST stay in sync.
agent_contract_version: v0-pre-rebuild
