# Foundation bundle v0.21.0 manifest
# Minor-additive release over v0.20.0 (Cut 1.7 — closes F-VAL20-1: the migrator shipped in the
# toolkit while nothing in either channel invoked it, itself a two-channel delivery failure).
# The engine half of this cut -- the declared migration set, fail-closed target resolution, the
# single-write composition, the conformance post-condition, remediation routing, and durable
# failure state -- ships with the toolkit (`wizard self-update`), not this bundle.
# This bundle carries the emitted-lib channel's half: the kernel runner's refusal message now
# names the ADAPTER, not a rebuild of the capability, when the registered adapter class has no
# read-only reader on it -- a defect in the adapter's shape that "rebuild this capability"
# sent an operator in a circle trying to fix. The health check and the acceptance refusal are
# also now kind-aware in what they DESCRIBE (never in what they block): a shared queue entry
# that is not a bespoke-writer bypass (for example, a safety check that itself could not finish)
# is described in its own words instead of the bypass-writer's "rebuild it" sentence, which names
# a fix that does not apply to it. Nothing about what blocks changed; only what is said about it.
# A fifth emitted file also lands in this cut: agents/lib/external_write/capability_invariants.py
# (the self-QA probe that scores a capability's own test suite "effective" only if it passes
# cleanly and then genuinely fails under a deliberate change). On Python 3.12 -- the operator's
# recommended runtime -- a pytest-style (zero real tests) suite fell into the generic "does not
# pass cleanly" message instead of the actionable "write them as unittest.TestCase" guidance,
# because the probe consulted the run's exit code before checking whether any tests actually ran,
# and CPython changed that exit code's meaning for a zero-tests-collected run between 3.9 and
# 3.12. The check is now ordered import-error, then zero-real-tests, then exit-code/failed, and
# keys only on unittest's own stable summary text -- no interpreter-version branch, no widening
# of what counts as passing.
# Foundation docs are BYTE-IDENTICAL to v0.20.0 (managed_files hashes unchanged;
# foundation_schema_version unchanged).
_note: JSON sidecar for manifest.yaml. The wizard runtime CLI consumes JSON; YAML is the human-facing
  companion. Both files MUST stay in sync.
